name: Release

on:
  push:
    tags:
      - 'v*' # Triggers on tags like v1.0.0

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Extension
        run: npm run package

      - name: Package VSIX
        run: npx @vscode/vsce package --no-dependencies
        id: vsix

      - name: Publish to VS Code Marketplace
        run: npx @vscode/vsce publish --no-dependencies -p ${{ secrets.VSCE_PAT }}
        id: publish_vscode
        continue-on-error: true

      - name: Publish to Open VSX Registry
        run: npx ovsx publish *.vsix -p ${{ secrets.OVSX_PAT }}
        id: publish_openvsx
        continue-on-error: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.0
        with:
          files: "*.vsix"
          generate_release_notes: true

      - name: Verify registry publishing
        if: always()
        env:
          VSCODE_PUBLISH_OUTCOME: ${{ steps.publish_vscode.outcome }}
          OPENVSX_PUBLISH_OUTCOME: ${{ steps.publish_openvsx.outcome }}
        run: |
          echo "VS Code Marketplace publish: ${VSCODE_PUBLISH_OUTCOME}"
          echo "Open VSX publish: ${OPENVSX_PUBLISH_OUTCOME}"
          if [ "${VSCODE_PUBLISH_OUTCOME}" != "success" ] || [ "${OPENVSX_PUBLISH_OUTCOME}" != "success" ]; then
            echo "One or more registry publishes failed; see the publish step logs."
            exit 1
          fi
